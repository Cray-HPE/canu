access-list ip MANAGED_NODE_ISOLATION
    10 comment DENY MTN NETWORKS FROM TALKING TO EACH OTHER
    20 deny any MTN_NETWORKS MTN_NETWORKS count
    30 comment Permit Unrestricted NCN to NCN Communication
    40 permit any NCN NCN count
    50 comment Permit DHCP traffic
    60 permit udp any range 67 68 any count
    70 comment Permit node to request TFTP file
    80 permit udp TFTP_SERVERS MANAGED_NODES count
    90 permit udp MANAGED_NODES TFTP_SERVERS count
    100 comment Permit node to perform DNS lookups
    110 permit udp any eq dns any count
    120 permit tcp any eq dns any count
    130 permit udp MANAGED_NODES CONTROL_PLANE eq dns count
    140 permit udp MANAGED_NODES NCN group NMN_UDP_SERVICES count
    150 comment Permit NTP replies from NCNs
    160 permit udp NCN eq ntp MANAGED_NODES count
    170 comment Permit access to NMN_TCP_SERVICES
    180 permit tcp MANAGED_NODES CONTROL_PLANE group NMN_TCP_SERVICES count
    190 comment Permit TCP replies using the 'established' keyword
    200 permit tcp CONTROL_PLANE MANAGED_NODES established count
    210 comment Allow SSH from NCNs to Managed Nodes
    220 permit tcp NCN MANAGED_NODES group SSH_ALTERNATE count
    230 permit tcp MANAGED_NODES group SSH_ALTERNATE NCN count
    240 comment Allow ping
    250 permit icmp any any count
    260 comment Permit OSPF from switches
    270 permit ospf ALL_SWITCHES any count
    280 comment Permit BGP (port 179) between spines and NCNs
    290 permit tcp SPINE_SWITCHES NCN eq bgp count
    300 permit tcp NCN SPINE_SWITCHES eq bgp count
    310 permit any CONTROL_PLANE CONTROL_PLANE count
    320 comment Permit VRRP from NCNs
    330 permit 112 NCN 224.0.0.18 count
    340 comment --- FINAL CATCH-ALL DENY ---
    350 deny any any any count
