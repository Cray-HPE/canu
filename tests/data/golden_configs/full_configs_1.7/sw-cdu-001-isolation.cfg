    20 192.168.100.0/255.255.252.0
    30 192.168.104.0/255.255.252.0
object-group ip address MANAGED_NODES
    10 192.168.3.0/255.255.128.0
    20 192.168.100.0/255.255.128.0
object-group ip address NMN_K8S_SERVICE
    10 10.92.100.0/255.255.255.0
    20 192.168.4.2
object-group ip address TFTP_SERVERS
    10 10.92.100.60
object-group port NMN_TCP_SERVICES
    10 eq dns
    20 eq dhcp-server
    30 eq http
    40 eq https
    50 eq syslog
    60 eq 2020
    70 eq 8080
    80 eq 8081
    90 eq 8883
    100 eq 8888
    110 eq 8514
    120 eq 6817
    130 eq 6818
    140 eq 6819
    150 eq 3260
object-group port NMN_UDP_SERVICES
    10 eq dns
    20 eq dhcp-server
    30 eq dhcp-client
    40 eq tftp
    50 eq syslog
    60 eq 8514
    70 eq ntp
access-list ip MANAGED_NODE_ISOLATION
    10 comment DENY MTN NETWORKS FROM TALKING TO EACH OTHER
    20 deny any MTN_NETWORKS MTN_NETWORKS count
    30 comment Permit Unrestricted NCN to NCN Communication
    40 permit any NCN NCN count
    50 comment Permit DHCP traffic
    60 permit udp any range 67 68 any count
    70 comment Permit node to request TFTP file
    80 permit udp TFTP_SERVERS MANAGED_NODES count
    90 permit udp MANAGED_NODES TFTP_SERVERS count
    100 comment Permit DNS traffic (queries and replies) to/from any host
    110 permit udp any any eq dns count
    120 permit udp any eq dns any count
    130 permit tcp any any eq dns count
    140 permit tcp any eq dns any count
    150 permit udp MANAGED_NODES NCN group NMN_UDP_SERVICES count
    160 comment Permit NTP replies from NCNs
    170 permit udp NCN eq ntp MANAGED_NODES count
    180 comment Permit access to NMN_TCP_SERVICES
    190 permit tcp MANAGED_NODES NMN_K8S_SERVICE group NMN_TCP_SERVICES count
    200 permit tcp MANAGED_NODES NCN group NMN_TCP_SERVICES count
    210 comment Permit TCP replies using the 'established' keyword
    220 permit tcp NCN MANAGED_NODES established count
    230 permit tcp NMN_K8S_SERVICE MANAGED_NODES established count
    240 comment Allow SSH from NCNs to Managed Nodes
    250 permit tcp NCN MANAGED_NODES eq ssh count
    260 permit tcp MANAGED_NODES eq ssh NCN count
    270 comment Allow ping
    280 permit icmp any any count
    290 comment Permit OSPF from switches
    300 permit ospf ALL_SWITCHES any count
    310 comment Permit BGP (port 179) between spines and NCNs
    320 permit tcp SPINE_SWITCHES NCN eq bgp count
    330 permit tcp NCN SPINE_SWITCHES eq bgp count
    340 permit any NMN_K8S_SERVICE NMN_K8S_SERVICE count
    350 permit any NMN_K8S_SERVICE NCN count
    360 permit any NCN NMN_K8S_SERVICE count
    370 comment Permit VRRP from NCNs
    380 permit 112 NCN 224.0.0.18 count
    390 comment --- FINAL CATCH-ALL DENY ---
    400 deny any any any count
access-list ip cmn-can
    10 deny any 192.168.12.0/255.255.255.0 192.168.11.0/255.255.255.0
    20 deny any 192.168.11.0/255.255.255.0 192.168.12.0/255.255.255.0
